<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>Balls or Gapes IV (test)</title>
<style>
  :root{--bg:#15110d;--card:#231b14;--ink:#eadfca;--dim:#a8977c;--gold:#d9a441;--ok:#6fbf73;--bad:#d9634f}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 Georgia,serif}
  main{max-width:560px;margin:auto;padding:12px} h1{font-size:1.2rem;color:var(--gold);margin:.2em 0} h2{font-size:1.05rem;margin:.2em 0;color:var(--gold)}
  .watch{border-style:dashed;opacity:.92}.watch ol{margin:6px 0 0 18px;padding:0}
  .card{background:var(--card);border:1px solid #3a2d20;border-radius:12px;padding:12px;margin:10px 0}
  button{display:block;width:100%;min-height:56px;margin:8px 0;font:inherit;color:var(--ink);background:#3b2a1a;border:2px solid var(--gold);border-radius:12px;padding:10px;text-align:left}
  button:disabled{opacity:.4} .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--dim);font-size:.85rem}
  input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px;background:#1c1610;color:var(--ink);border:1px solid #555;border-radius:10px;margin:4px 0}
  nav{display:flex;gap:4px} nav button{min-height:44px;text-align:center;padding:4px;font-size:.9rem;margin:4px 0}
  nav button.on{background:var(--gold);color:#15110d}
  table{width:100%;border-collapse:collapse;font-size:.9rem} td{padding:2px 4px;border-bottom:1px solid #3a2d20}
  #chatlog,#reqlog{max-height:30vh;overflow:auto;font-size:.9rem} #chatlog p,#reqlog p{margin:.3em 0;overflow-wrap:anywhere}
  .row{display:flex;gap:6px} .row input{flex:1;min-width:0} .row button{width:auto;min-height:44px;margin:4px 0;text-align:center;padding:0 14px}
  .portrait svg{width:160px;height:160px;display:block;margin:4px auto;border-radius:12px} #tie button{text-align:center;font-size:1.25rem;min-height:64px}
  #party{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px} .pm{font-size:.85rem;padding:2px 8px;border:1px solid #555;border-radius:10px} .pm.me{border-color:#d9a43a} .ghost{color:#cfe8ff;font-size:.85em}
  .arow{display:grid;grid-template-columns:3.2em 2.4em 1fr 56px 56px;align-items:center;gap:6px;margin:6px 0} .arow button{min-height:56px;font-size:1.6rem;margin:0;padding:0;text-align:center} .arow .val{font-size:1.3rem;text-align:center}
  .ph{border:1px dashed var(--bad);padding:4px 8px;border-radius:8px;color:var(--bad);font-size:.85rem}
</style></head>
<body><main>
  <h1>Balls or Gapes IV <span class="dim">test build, local only</span></h1>
  <div id="app"><p>Loading…</p></div>
</main>
<script src="config.js"></script><script src="teacher_tables.js"></script><script src="teacher.js"></script><script src="portrait.js"></script><script src="engine.js"></script><script src="store.js"></script><script src="app.js"></script>
</body></html>
